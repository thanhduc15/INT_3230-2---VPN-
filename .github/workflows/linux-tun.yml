name: Linux TUN integration
on:
  workflow_dispatch:
  push:
    branches: ['main', '24020078/vpn-core-framing']
    paths:
      - 'src/main/java/**'
      - 'scripts/tun-io.py'
      - 'scripts/create-demo-certs.sh'
      - 'scripts/build.sh'
      - 'scripts/test-linux-tun.sh'
      - '.github/workflows/linux-tun.yml'
permissions:
  contents: read
jobs:
  ping-and-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare packet capture
        run: |
          if ! command -v tcpdump >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tcpdump
          fi
      - name: Exercise mTLS tunnel between two network namespaces
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          sudo env VPN_CAPTURE=1 PATH="$JAVA_HOME_17_X64/bin:$PATH" bash scripts/test-linux-tun.sh 2>&1 | tee build/linux-tun-console.log
      - name: Make demo evidence readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build
      - name: Save logs and Wireshark captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-demo-evidence
          retention-days: 14
          path: |
            build/linux-tun-console.log
            build/tun.*/*.log
            build/tun.*/*.pcap
